name: Scheduled Emails

on:
  schedule:
    # Weekly pregnancy emails: DAILY at 6:00 UTC (9:00 Israel time) — sends only when user's week changes
    - cron: '0 6 * * *'
    # Nudge emails + price check: Daily at 7:00 UTC (10:00 Israel time during DST)
    - cron: '0 7 * * *'
    # Image validation: Sundays at 5:00 UTC (8:00 Israel time)
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      function:
        description: 'Which function to run'
        required: true
        type: choice
        options:
          - send-weekly-emails
          - send-nudge-emails
          - nudge-invitation
          - check-prices
          - validate-images
          - sync-resend-emails
          - both

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Send Weekly Emails
        if: >
          github.event.schedule == '0 6 * * *' ||
          github.event.inputs.function == 'send-weekly-emails' ||
          github.event.inputs.function == 'both'
        run: |
          max_retries=3
          retry_delay=10

          for attempt in $(seq 1 $max_retries); do
            echo "Attempt $attempt of $max_retries..."

            response=$(curl -s -w "\n%{http_code}" --max-time 180 \
              -X POST \
              "${{ secrets.SUPABASE_URL }}/functions/v1/send-weekly-emails" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Content-Type: application/json")

            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | head -n -1)

            echo "Status: $http_code"
            echo "Response: $body"

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 400 ]; then
              echo "Weekly emails succeeded."
              exit 0
            fi

            if [ "$http_code" -ge 500 ] && [ "$attempt" -lt "$max_retries" ]; then
              echo "Server error ($http_code), retrying in ${retry_delay}s..."
              sleep $retry_delay
              retry_delay=$((retry_delay * 2))
              continue
            fi

            echo "::error::Weekly emails failed with status $http_code"
            exit 1
          done

      - name: Send Nudge Emails
        if: >
          github.event.schedule == '0 7 * * *' ||
          github.event.inputs.function == 'send-nudge-emails' ||
          github.event.inputs.function == 'both'
        run: |
          max_retries=3
          retry_delay=10

          for attempt in $(seq 1 $max_retries); do
            echo "Attempt $attempt of $max_retries..."

            response=$(curl -s -w "\n%{http_code}" --max-time 180 \
              -X POST \
              "${{ secrets.SUPABASE_URL }}/functions/v1/send-nudge-emails" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Content-Type: application/json")

            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | head -n -1)

            echo "Status: $http_code"
            echo "Response: $body"

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 400 ]; then
              echo "Nudge emails succeeded."
              exit 0
            fi

            if [ "$http_code" -ge 500 ] && [ "$attempt" -lt "$max_retries" ]; then
              echo "Server error ($http_code), retrying in ${retry_delay}s..."
              sleep $retry_delay
              retry_delay=$((retry_delay * 2))
              continue
            fi

            echo "::error::Nudge emails failed with status $http_code"
            exit 1
          done

      - name: Nudge Pending Invitations
        if: >
          github.event.schedule == '0 7 * * *' ||
          github.event.inputs.function == 'nudge-invitation' ||
          github.event.inputs.function == 'both'
        run: |
          max_retries=3
          retry_delay=10

          for attempt in $(seq 1 $max_retries); do
            echo "Attempt $attempt of $max_retries..."

            response=$(curl -s -w "\n%{http_code}" --max-time 180 \
              -X POST \
              "${{ secrets.SUPABASE_URL }}/functions/v1/nudge-invitation" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Content-Type: application/json")

            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | head -n -1)

            echo "Status: $http_code"
            echo "Response: $body"

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 400 ]; then
              echo "Invitation nudge succeeded."
              exit 0
            fi

            if [ "$http_code" -ge 500 ] && [ "$attempt" -lt "$max_retries" ]; then
              echo "Server error ($http_code), retrying in ${retry_delay}s..."
              sleep $retry_delay
              retry_delay=$((retry_delay * 2))
              continue
            fi

            echo "::error::Invitation nudge failed with status $http_code"
            exit 1
          done

      - name: Check Prices
        if: >
          github.event.schedule == '0 7 * * *' ||
          github.event.inputs.function == 'check-prices' ||
          github.event.inputs.function == 'both'
        run: |
          response=$(curl -s -w "\n%{http_code}" --max-time 150 \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/check-prices" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 400 ]; then
            echo "Price check succeeded."
          else
            echo "::warning::Price check failed with status $http_code"
          fi

      - name: Validate Images
        if: >
          github.event.schedule == '0 5 * * 0' ||
          github.event.inputs.function == 'validate-images' ||
          github.event.inputs.function == 'both'
        run: |
          response=$(curl -s -w "\n%{http_code}" --max-time 120 \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/validate-images" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 400 ]; then
            echo "Image validation succeeded."
          else
            echo "::warning::Image validation failed with status $http_code"
          fi

      - name: Sync Resend Email Logs
        if: >
          github.event.schedule == '0 7 * * *' ||
          github.event.inputs.function == 'sync-resend-emails' ||
          github.event.inputs.function == 'both'
        run: |
          max_retries=3
          retry_delay=10

          for attempt in $(seq 1 $max_retries); do
            echo "Attempt $attempt of $max_retries..."

            response=$(curl -s -w "\n%{http_code}" --max-time 120 \
              -X POST \
              "${{ secrets.SUPABASE_URL }}/functions/v1/sync-resend-emails" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Content-Type: application/json")

            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | head -n -1)

            echo "Status: $http_code"
            echo "Response: $body"

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 400 ]; then
              echo "Resend email sync succeeded."
              exit 0
            fi

            if [ "$http_code" -ge 500 ] && [ "$attempt" -lt "$max_retries" ]; then
              echo "Server error ($http_code), retrying in ${retry_delay}s..."
              sleep $retry_delay
              retry_delay=$((retry_delay * 2))
              continue
            fi

            echo "::error::Resend email sync failed with status $http_code"
            exit 1
          done
