<!--
  Nesty - Supabase "Confirm signup" email template.
  Paste this into Supabase Dashboard → Auth → Email Templates → "Confirm signup".
  Subject line to set above the template: אשרו את הרשמתכם ל-Nesty 💜
  Supabase template variable used: {{ .ConfirmationURL }}
-->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="light only"/>
  <meta name="supported-color-modes" content="light"/>
  <title>אשרו את ההרשמה ל-Nesty</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>:root { color-scheme: light only; }</style>
</head>
<body style="margin:0;padding:0;background:#f5f0fa;font-family:'Heebo',sans-serif;direction:rtl;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f0fa;direction:rtl;">
  <tr>
    <td align="center" style="padding:40px 16px 64px;">
      <table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;direction:rtl;">

        <!-- HEADER -->
        <tr>
          <td style="padding-bottom:28px;">
            <a href="https://nestyil.com" style="text-decoration:none;">
              <img src="https://nestyil.com/Nesty_logo.png" alt="Nesty" style="height:40px;width:auto;display:block;margin:0 auto;" />
            </a>
          </td>
        </tr>

        <!-- HERO -->
        <tr>
          <td style="background:linear-gradient(145deg,#6a35b0 0%,#9b62d4 60%,#c4a0e8 100%);border-radius:24px;padding:48px 40px 44px;text-align:center;">
            <div style="display:inline-block;background:#ffffff;border-radius:50%;padding:18px 22px;margin-bottom:20px;line-height:0;">
              <span style="font-size:38px;line-height:1;">💜</span>
            </div>
            <h1 style="margin:0 0 12px;font-size:30px;font-weight:800;color:#ffffff;line-height:1.25;">
              שמחים שהצטרפת ל-Nesty
            </h1>
            <p style="margin:0;font-size:15px;color:#ffffffd9;line-height:1.7;">
              נשאר רק לאשר את האימייל שלך וסיימנו - ואז אפשר להתחיל לבנות את הקן 🪺
            </p>
          </td>
        </tr>

        <tr><td style="height:20px;"></td></tr>

        <!-- CTA CARD -->
        <tr>
          <td style="background:#fff;border-radius:20px;padding:36px 32px;border:1.5px solid #e8daf5;text-align:center;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#6750a4;color:#ffffff;font-size:16px;font-weight:700;text-decoration:none;padding:16px 40px;border-radius:100px;letter-spacing:0.01em;">
              אישור ההרשמה →
            </a>

            <p style="margin:28px 0 6px;font-size:13px;color:#a087c0;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;">
              או העתיקי את הקישור
            </p>
            <p style="margin:0;word-break:break-all;">
              <a href="{{ .ConfirmationURL }}" style="color:#6750a4;font-size:13px;text-decoration:underline;direction:ltr;display:inline-block;">{{ .ConfirmationURL }}</a>
            </p>
          </td>
        </tr>

        <tr><td style="height:16px;"></td></tr>

        <!-- SECURITY NOTE -->
        <tr>
          <td style="background:#fff;border-radius:20px;padding:20px 28px;border:1.5px solid #e8daf5;">
            <p style="margin:0;font-size:13px;color:#7a6090;line-height:1.7;">
              לא נרשמת ל-Nesty? אפשר להתעלם מהמייל הזה בשקט.
            </p>
          </td>
        </tr>

        <!-- FOOTER -->
        <tr>
          <td style="padding:30px 0 0;text-align:center;">
            <a href="https://nestyil.com" style="text-decoration:none;">
              <img src="https://nestyil.com/Nesty_logo.png" alt="Nesty" style="height:24px;width:auto;margin-bottom:10px;" />
            </a>
            <p style="margin:0 0 6px;font-size:12px;color:#a087c0;">
              נשלח באהבה על ידי <strong style="color:#7c4dbd;">Nesty</strong>
            </p>
            <p style="margin:0;font-size:12px;color:#bca8d4;">
              <a href="https://nestyil.com" style="color:#9070b8;text-decoration:underline;">nestyil.com</a>
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
