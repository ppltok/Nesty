<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboarding Step 5 - איך הגעת אלינו?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #faf8ff; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-[28px] shadow-xl p-8">
    <div class="space-y-6">
      <div class="text-center">
        <div class="w-16 h-16 rounded-[20px] flex items-center justify-center mx-auto mb-4" style="background: rgba(211,228,253,0.4);">
          <span class="text-3xl">📣</span>
        </div>
        <h1 class="text-2xl font-medium mb-2" style="color:#1d192b;">איך הגעת אלינו?</h1>
        <p style="color:#49454f;">זה עוזר לנו להבין איפה למצוא עוד הורים כמוך</p>
      </div>

      <div class="grid grid-cols-2 gap-3" id="sources"></div>

      <div class="flex gap-3">
        <button class="flex-1 flex items-center justify-center gap-2 px-6 py-4 rounded-[28px] bg-white border-2 font-medium transition-all"
          style="border-color:#e7e0ec;color:#1d192b;">
          <span>→</span> חזור
        </button>
        <button class="flex-1 flex items-center justify-center gap-2 px-6 py-4 rounded-[28px] text-white font-medium transition-all"
          style="background:#6750a4;">
          המשך <span>←</span>
        </button>
      </div>

      <button class="w-full text-center text-sm transition-colors" style="color:#49454f;">דלג</button>
    </div>
  </div>

  <script>
    const sources = [
      { value: 'facebook',  emoji: '📘', title: 'פייסבוק' },
      { value: 'instagram', emoji: '📸', title: 'אינסטגרם' },
      { value: 'google',    emoji: '🔍', title: 'חיפוש בגוגל' },
      { value: 'tiktok',    emoji: '🎵', title: 'טיקטוק' },
      { value: 'friend',    emoji: '💬', title: 'חבר/ה המליצ/ה' },
      { value: 'other',     emoji: '✨', title: 'אחר' },
    ];
    let selected = null;
    const container = document.getElementById('sources');

    function render() {
      container.innerHTML = '';
      sources.forEach(s => {
        const btn = document.createElement('button');
        const isSelected = selected === s.value;
        btn.className = 'p-4 rounded-[20px] border-2 text-center transition-all';
        btn.style.borderColor = isSelected ? '#6750a4' : '#e7e0ec';
        btn.style.background = isSelected ? 'rgba(243,237,255,0.5)' : 'white';
        btn.innerHTML = `
          <span class="text-2xl block mb-2">${s.emoji}</span>
          <p class="font-medium text-sm" style="color:#1d192b;">${s.title}</p>
        `;
        btn.onclick = () => { selected = s.value; render(); };
        container.appendChild(btn);
      });
    }
    render();
  </script>
</body>
</html>
